# XcodeGen: `xcodegen` sukuria CarVideo.xcodeproj (GitHub Actions tai daro automatiškai).
name: CarVideo
options:
  bundleIdPrefix: com.example
  developmentLanguage: lt   # v12: kalbos – Localizable.xcstrings (en, de, pl, es, fr)
  deploymentTarget:
    iOS: "17.0"
# v8: Google Maps SDK for iOS (nebūtinas – be rakto naudojamas Apple žemėlapis)
packages:
  # v15: MapLibre – žemėlapiai be interneto (atviras kodas, BSD)
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0
targets:
  CarVideo:
    type: application
    platform: iOS
    sources: [CarVideo, Shared]
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: MapLibre
        product: MapLibre
      - target: CarVideoWidget
    info:
      path: CarVideo/Info.plist
      properties:
        CFBundleDisplayName: CarVideo
        CFBundleShortVersionString: "19.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Vieta reikalinga žemėlapiui ir greičiui, kad video sustotų važiuojant."
        LSApplicationQueriesSchemes: [waze, comgooglemaps, youtube, spotify]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Mikrofonas reikalingas balso komandoms."
        NSAppleMusicUsageDescription: "Apple Music valdymas muzikos skydelyje šalia žemėlapio."
        UIBackgroundModes: [audio]
        # v17: bendras pranešimų serveris įrašomas kompiliuojant (GitHub Secrets → SUPABASE_URL, SUPABASE_KEY)
        SupabaseURL: "$(SUPABASE_URL)"
        SupabaseKey: "$(SUPABASE_KEY)"
        NSCameraUsageDescription: "Kamera reikalinga parkavimo vietos nuotraukai."
        NSPhotoLibraryUsageDescription: "Galima pasirinkti parkavimo vietos nuotrauką iš galerijos."
        NSSpeechRecognitionUsageDescription: "Kalba atpažįstama balso komandoms (pvz. „Važiuok namo“)."
        # v11: CarPlay ekranas (veikia tik su Apple patvirtintu leidimu carplay-maps)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        CFBundleURLTypes:
          - CFBundleURLName: carvideo
            CFBundleURLSchemes: [carvideo]
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        # v11: gavus Apple CarPlay leidimą, atkomentuoti:
        # CODE_SIGN_ENTITLEMENTS: CarVideo/CarVideo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
  # v2: iPhone valdiklis „Važiuoti namo“
  CarVideoWidget:
    type: app-extension
    platform: iOS
    sources: [CarVideoWidget, Shared]
    info:
      path: CarVideoWidget/Info.plist
      properties:
        CFBundleDisplayName: Važiuoti namo
        CFBundleShortVersionString: "19.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.widget
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
schemes:
  CarVideo:
    build:
      targets:
        CarVideo: all
    archive:
      config: Release
